<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mazi O Matthew Platform</title>
  <meta name="description" content="Mazi O Matthew Platform — connect, create and grow.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#">MAZI O MATTHEW</a>
    <nav>
      <button data-view="home">Home</button>
      <button data-view="discover">Discover</button>
      <button data-view="profile">Profile</button>
      <button id="authButton">Login / Sign Up</button>
    </nav>
  </header>

  <main id="app">
    <section class="hero">
      <div>
        <p class="eyebrow">MAZI O MATTHEW PLATFORM</p>
        <h1>Connect. <span>Create. Grow.</span></h1>
        <p class="hero-copy">Share ideas, photos and videos, build your profile, follow people and grow your digital community.</p>
        <div class="hero-actions">
          <button class="primary" data-view="home">Explore Feed</button>
          <button class="secondary" id="heroAuth">Join the Platform</button>
        </div>
      </div>
    </section>

    <section id="view" class="content">
      <div id="status" class="status"></div>
      <div id="viewContent"></div>
    </section>
  </main>

  <div id="authModal" class="modal hidden">
    <div class="modal-card">
      <button class="close" id="closeAuth">×</button>
      <h2 id="authTitle">Create account</h2>
      <form id="authForm">
        <div id="signupFields">
          <input id="fullName" placeholder="Full name" autocomplete="name">
          <input id="username" placeholder="Username" autocomplete="username">
        </div>
        <input id="email" type="email" placeholder="Email address" autocomplete="email" required>
        <input id="password" type="password" placeholder="Password" autocomplete="current-password" required minlength="8">
        <button class="primary full" id="authSubmit">Sign Up</button>
      </form>
      <button class="link" id="toggleAuth">Already have an account? Login</button>
      <button class="link" id="forgotPassword">Forgot password?</button>
      <p id="authMessage" class="message"></p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
